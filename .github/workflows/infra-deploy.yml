name: Infra Deploy (Manual)

on:
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action to run
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply

env:
  TF_VERSION: '1.8.5'
  TF_VAR_environment: prod
  TF_VAR_azure_location: polandcentral
  TF_VAR_resource_group_name: rg-zhyto-ukrinvest
  TF_VAR_container_registry_name: acrzhytoukrinvest
  TF_VAR_web_app_name: app-zhyto-ukrinvest
  TF_VAR_app_service_plan_name: asp-zhyto-ukrinvest
  TF_VAR_cosmos_db_account_name: cosmos-zhyto-ukrinvest
  TF_VAR_keyvault_name: kv-zhyto-ukrinvest
  TF_VAR_storage_account_name: sazhytoukrinvest
  TF_VAR_chroma_share_name: chroma-zhyto-ukrinvest
  TF_VAR_openai_account_name: oaizhytoukrinvest
  TF_VAR_openai_custom_subdomain_name: oaizhytoukrinvest

jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: azure-prod
    defaults:
      run:
        working-directory: ./infrastructure

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Export ARM credentials for Terraform
        run: |
          set -euo pipefail

          CREDS_FILE="$(mktemp)"
          echo '${{ secrets.AZURE_CREDENTIALS }}' > "$CREDS_FILE"

          echo "ARM_CLIENT_ID=$(jq -r '.clientId' "$CREDS_FILE")" >> "$GITHUB_ENV"
          echo "ARM_CLIENT_SECRET=$(jq -r '.clientSecret' "$CREDS_FILE")" >> "$GITHUB_ENV"
          echo "ARM_TENANT_ID=$(jq -r '.tenantId' "$CREDS_FILE")" >> "$GITHUB_ENV"
          echo "ARM_SUBSCRIPTION_ID=$(jq -r '.subscriptionId' "$CREDS_FILE")" >> "$GITHUB_ENV"

          rm -f "$CREDS_FILE"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ secrets.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TFSTATE_CONTAINER }}" \
            -backend-config="key=${{ secrets.TFSTATE_KEY }}"

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        run: terraform plan -input=false -no-color -out=tfplan
        env:
          TF_VAR_azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          TF_VAR_auth_token_secret: ${{ secrets.AUTH_TOKEN_SECRET }}

      - name: Terraform Apply
        if: ${{ inputs.action == 'apply' }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Upload Terraform Plan Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ./infrastructure/tfplan
