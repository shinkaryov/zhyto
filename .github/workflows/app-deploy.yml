name: App Deploy (Manual)

on:
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: Deploy backend container
        required: true
        type: boolean
        default: true
      deploy_frontend:
        description: Deploy frontend static website
        required: true
        type: boolean
        default: true
      image_tag:
        description: Backend image tag
        required: true
        default: latest

env:
  AZURE_RESOURCE_GROUP: rg-zhyto-ukrinvest
  ACR_NAME: acrzhytoukrinvest
  BACKEND_WEB_APP_NAME: app-zhyto-ukrinvest
  STORAGE_ACCOUNT_NAME: sazhytoukrinvest
  AUTH_WHITELIST_BLOB_NAME: email_whitelist.txt

jobs:
  deploy-backend:
    if: ${{ inputs.deploy_backend }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: azure-prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Resolve ACR login server
        id: acr
        run: |
          set -euo pipefail
          LOGIN_SERVER=$(az acr show \
            --name "${{ env.ACR_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query loginServer -o tsv)
          echo "login_server=$LOGIN_SERVER" >> "$GITHUB_OUTPUT"

      - name: Download auth email whitelist from Blob
        run: |
          set -euo pipefail
          mkdir -p src/auth

          BLOB_NAME="${{ env.AUTH_WHITELIST_BLOB_NAME }}"
          if [ -z "$BLOB_NAME" ]; then
            BLOB_NAME="email_whitelist.txt"
          fi

          az storage blob download \
            --account-name "${{ env.STORAGE_ACCOUNT_NAME }}" \
            --auth-mode login \
            --container-name "raw-data" \
            --name "$BLOB_NAME" \
            --file "src/auth/email_whitelist.txt"

          test -s "src/auth/email_whitelist.txt"

      - name: Build and push backend image
        run: |
          set -euo pipefail
          IMAGE="${{ steps.acr.outputs.login_server }}/ukraine-invest-backend:${{ inputs.image_tag }}"

          az acr login --name "${{ env.ACR_NAME }}"
          docker build -f backend/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Update backend web app container image
        run: |
          set -euo pipefail
          IMAGE="${{ steps.acr.outputs.login_server }}/ukraine-invest-backend:${{ inputs.image_tag }}"

          az webapp config container set \
            --name "${{ env.BACKEND_WEB_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --container-image-name "$IMAGE" \
            --container-registry-url "https://${{ steps.acr.outputs.login_server }}"

          # Ensure ACR pull keeps using the web app managed identity (no ACR admin creds needed).
          az webapp config set \
            --name "${{ env.BACKEND_WEB_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --generic-configurations '{"acrUseManagedIdentityCreds": true}'

          az webapp config appsettings set \
            --name "${{ env.BACKEND_WEB_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --settings WEBSITES_PORT=8000

      - name: Verify backend health
        run: |
          set -euo pipefail
          BACKEND_URL="https://${{ env.BACKEND_WEB_APP_NAME }}.azurewebsites.net/health/ready"

          for i in {1..30}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$BACKEND_URL" || echo "000")
            if [ "$HTTP_CODE" -eq 200 ]; then
              echo "Backend healthy: $BACKEND_URL"
              exit 0
            fi
            echo "Attempt $i: HTTP $HTTP_CODE"
            sleep 10
          done

          echo "Backend failed health check"
          exit 1

  deploy-frontend:
    if: ${{ inputs.deploy_frontend }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: azure-prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend for static website
        run: |
          set -euo pipefail
          cd frontend

          API_BASE_URL="https://${{ env.BACKEND_WEB_APP_NAME }}.azurewebsites.net"

          npm ci
          VITE_API_URL="$API_BASE_URL" npm run build

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Upload static frontend to $web
        run: |
          set -euo pipefail
          az storage blob upload-batch \
            --account-name "${{ env.STORAGE_ACCOUNT_NAME }}" \
            --auth-mode login \
            --destination '$web' \
            --source frontend/dist \
            --overwrite

      - name: Print frontend URL
        run: |
          set -euo pipefail
          FRONTEND_URL=$(az storage account show \
            --name "${{ env.STORAGE_ACCOUNT_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "primaryEndpoints.web" -o tsv)
          echo "Frontend available at: $FRONTEND_URL"
